; PlatformIO Project Configuration File
;
; Programme principal : env "nanoatmega328" (par defaut).
; Tests unitaires : choisir l'env "test_xxx" dans la barre PlatformIO,
; ou en ligne de commande : pio run -e test_bpm -t upload
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nanoatmega328

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino
; upload_port = COM4
upload_speed = 115200
monitor_speed = 115200
lib_deps =
    olikraus/U8g2
    makuna/RTC


; Programme complet : menu + graphique (ecran 1), BPM en continu (ecran 2).
[env:nanoatmega328]
build_src_filter =
    +<*>
    -<tests_unitaires/>