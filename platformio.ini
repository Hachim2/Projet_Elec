; PlatformIO Project Configuration File
;
; Programme principal : env "nanoatmega328" (par defaut).
; Tests unitaires : choisir l'env "test_xxx" dans la barre PlatformIO,
; ou en ligne de commande : pio run -e test_bpm -t upload
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nanoatmega328

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino
; upload_port = COM4
upload_speed = 115200
monitor_speed = 115200
lib_deps =
    olikraus/U8g2
    makuna/RTC

; Programme complet : menu + graphique (ecran 1), BPM en continu (ecran 2).
[env:nanoatmega328]
build_src_filter =
    +<*>
    -<tests_unitaires/>

; Module bpm seul, BPM envoye a Teleplot.
[env:test_bpm_module]
build_src_filter =
    -<*>
    +<bpm.cpp>
    +<tests_unitaires/bpm_module_test.cpp>

; Signal brut du capteur PPG.
[env:test_bpm]
monitor_speed = 9600
build_src_filter = -<*> +<tests_unitaires/bpm_test.cpp>

[env:test_btn_leds]
monitor_speed = 9600
build_src_filter = -<*> +<tests_unitaires/btn_leds_test.cpp>

[env:test_buzzer]
build_src_filter = -<*> +<tests_unitaires/buzzer_test.cpp>

[env:test_encodeur]
monitor_speed = 9600
build_src_filter = -<*> +<tests_unitaires/encodeur_test.cpp>

[env:test_oled]
build_src_filter = -<*> +<tests_unitaires/Oled_test.cpp>

[env:test_rtc]
monitor_speed = 9600
build_src_filter = -<*> +<tests_unitaires/rtc_test.cpp>